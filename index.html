<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#7c3aed" />
  <meta name="robots" content="noindex,nofollow" />
  <title>伴学宠物 · 班级积分乐园</title>
  <meta name="description" content="伴学宠物：班级积分、幻兽养成、手机扫码迁移，多台电脑自动同步。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css?v=3300">
  <link rel="stylesheet" href="games.css?v=3300">
</head>
<body>
  <header id="topbar">
    <div class="tb-side"><button id="classBtn" title="全班">全班</button></div>
    <h1 id="tbTitle">伴学宠物</h1>
    <div class="tb-side tb-r"><button id="parentBtn" title="老师入口">老师</button><button id="acctBtn" title="账号">👤</button></div>
  </header>
  <main id="view"></main>
  <nav id="tabbar"></nav>
  <div id="toast"></div>
  <div id="upTip" hidden>
    <span>🎉 新版本已就绪：每学年 460 关</span>
    <button id="upGo">立即更新</button>
    <button id="upX" aria-label="稍后">×</button>
  </div>
  <script src="lib/lz.min.js"></script>
  <script src="lib/qrg.js"></script>
  <script src="lib/jsqr.js"></script>
  <script src="cloud.js?v=3300"></script>
  <script src="auth.js?v=3300"></script>
  <script src="app.js?v=3300"></script>
  <script src="games.js?v=3300"></script>
  <script>
    /* 版本更新提示：SW 换代后不打断答题，先给一条可点提示 */
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var tip = document.getElementById('upTip');
      window.showUpdTip = function () { if (tip) tip.hidden = false; };
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js?v=3300', { updateViaCache: 'none' }).then(function (reg) {
          setInterval(function () { reg.update().catch(function () {}); }, 30 * 60 * 1000);
        }).catch(function () {});
      });
      var go = document.getElementById('upGo');
      if (go) go.onclick = function () { location.reload(); };
      var x = document.getElementById('upX');
      if (x) x.onclick = function () { tip.hidden = true; };
    })();
  </script>
</body>
</html>
